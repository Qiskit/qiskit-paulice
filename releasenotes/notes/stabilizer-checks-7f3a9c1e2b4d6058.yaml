---
features:
  - |
    :func:`~qiskit_paulice.checks.add_pauli_checks` can now find checks for circuit stabilizers,
    rather than being restricted to only finding checks with respect to terminal measurements. Use
    the new ``stabilizers`` argument to specify a subset of stabilizers for which to find valid checks.
  - |
    :meth:`~qiskit_paulice.checked_circuit.CheckedCircuit.estimate_fault_rates` reports, for a
    circuit that measures no payload qubit, the fraction of accepted shots whose error changes
    the prepared state as its logical error rate.
