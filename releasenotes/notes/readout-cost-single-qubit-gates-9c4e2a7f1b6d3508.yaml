---
fixes:
  - |
    The cost that :func:`~qiskit_paulice.add_pauli_checks` minimizes ignored
    ``readout_noise`` on every qubit whose last gate was a single-qubit gate, so such a
    qubit's readout error neither raised the reported ``cost`` nor steered the search
    toward checks that detect it. The readout error on every qubit is now counted.
  - |
    With ``stabilizers`` given, the cost counted ``readout_noise`` on a qubit only where
    a protected stabilizer acts as ``Z`` or ``Y`` at the end of the circuit, as though
    every qubit were measured in the ``Z`` basis. Now, readout noise will be applied in
    stabilizer mode when at least one stabilizer acts non-trivially on the qubit being read.
