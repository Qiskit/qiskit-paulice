---
upgrade:
  - |
    :func:`qiskit_paulice.checks.add_pauli_checks` now raises a ``ValueError`` when the
    supplied :class:`qiskit_paulice.NoiseModel` sets ``idling_noise``, which was previously
    ignored without warning. The idling model is not currently trustworthy, and silently
    dropping it let callers believe check placement had accounted for idling noise.
    :meth:`qiskit_paulice.CheckedCircuit.estimate_fault_rates` rejects it for the same
    reason. Pass ``idling_noise=None`` (the default) to restore the previous effective
    behavior. Both entry points now share one validation: an unrecognized ``gate_noise``
    specification (previously ignored by ``add_pauli_checks``), ``readout_noise`` outside
    ``[0, 0.5)``, and layered gate noise on a circuit containing CX gates (previously a Rust
    panic) all raise a ``ValueError``.
