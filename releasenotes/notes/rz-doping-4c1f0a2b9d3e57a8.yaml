---
features:
  - |
    Added the new :func:`qiskit_paulice.doping.dope_clifford_circuit` function, which dopes a
    Clifford circuit with ``RZ`` rotations at wires classified via the spacetime stabilizer
    formalism (`arXiv:2607.25941 <https://arxiv.org/abs/2607.25941>`__, Sec. S1.3),
    implementing the reference's site selection with its iterated pruning rewrites so that
    every inserted rotation is irreducible, injecting magic for any non-Clifford angle. When
    given a :class:`qiskit_paulice.CheckedCircuit`, doping is restricted to wires commuting
    with every check's back-cumulant, so the spacetime code and its post-selection are
    preserved. Doped wires are reported as :class:`qiskit_paulice.doping.DopingSite`
    instances. The ``wires`` argument selects the candidate wires: every wire segment (the
    default), or only those directly following or directly preceding an entangling gate, one
    per qubit per entangling layer, the former reproducing the reference's site selection.
    The ``angle`` argument sets the rotation angle, ``pi/4`` (a ``T`` gate) by default;
    Clifford angles such as ``pi/2`` keep the doped circuit Clifford for validation, and
    ``angle=None`` emits one template circuit with a ``dope`` parameter per site, covering
    every doping configuration (``pi/4`` for ``T``, ``pi/2`` for ``S``, ``pi`` for ``Z``,
    ``0`` for identity) with a single pulse schedule.
