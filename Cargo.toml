[package]
name = "_internal-r"
version = "0.1.0"
edition = "2024"

[lib]
name = "_internal_r"
crate-type = ["cdylib"]

[dependencies]
rustiq-core = "0.0.9"
# `extension-module` is enabled by maturin for wheel builds (see `[tool.maturin]`
# in pyproject.toml) rather than here, so that `cargo test` can link the unit
# tests against libpython.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rayon = "1.11.0"
itertools = "0.15.0"
rand = "0.10.3"
rand_distr = "0.6.0"
